[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cape-pins"
version = "0.3.0.dev0"
description = "CAPE-Pins: Crackle-compatible componentwise adaptive pin encoder and benchmark pipeline"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ilkhom Abdurazzokov" }]
requires-python = ">=3.12,<3.13"
# Runtime/test dependencies are pinned with hashes in requirements.lock (see requirements.in).

[tool.scikit-build]
# Supported build path on Windows/MinGW: scripts/build_native.py (CMake + Ninja + g++).
# For `pip install .` set CMAKE_GENERATOR=Ninja and CXX=g++ first.
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["cape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (large volumes, exhaustive enumeration)",
    "acceptance: T1-T12 automatic-export integration tests (spec section 38)",
]

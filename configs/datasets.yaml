# Dataset registry (spec section 18). Download authorization recorded 2026-11-05:
# CREMI A/B/C authorized; H01 and MICrONS NOT authorized (fetch_data.py refuses them unless
# --i-have-authorization is passed after a new explicit approval).
# SNEMI3D download authorized 2026-11-06 (scripts/fetch_snemi3d.py); compression on it only when a
# confirmatory run is explicitly requested.
schema_version: 1
datasets:
  synthetic:
    role: correctness and adversarial tests (never part of real result tables)
    license: generated by this project
    real: false
    splits: [synthetic]
  crackle_samples:
    role: smoke and development
    source_url: https://github.com/seung-lab/crackle
    source_version: 14b39b196a14b3b1ba7d1cd34f350c324308000f
    files:
      connectomics: {file: connectomics.npy.cpso.gz, axes: XYZ, codec: compresso+gzip}
      ws: {file: ws.npy.cpso.gz, axes: XYZ, codec: compresso+gzip}
    license: unknown (data files inside a BSD-3 code repository; data terms not stated) - never redistributed
    citation: S1
    real: true
    splits: [development]
    authorized_download: true
  cremi:
    role: sample A development; samples B and C held-out compression test
    official_page: https://cremi.org/data/
    array_key: volumes/labels/neuron_ids
    axes: ZYX
    note: public training volumes; held-out here means our compression test split, not the challenge hidden test
    license: unknown - follow cremi.org terms; never redistributed
    citation: S10
    real: true
    splits: [development, heldout]
    authorized_download: true
    mirror:
      # cremi.org was unreachable on 2026-11-05 (TCP 80/443 timeout); the user approved this mirror
      provider: huggingface
      repo: pytc/tutorial
      path: cremi/orig
      files: [sample_A_20160501.hdf, sample_B_20160501.hdf, sample_C_20160501.hdf]
      authorized: true
      authorized_on: "2026-11-05"
      verification: every file must match the LFS SHA-256 published by the mirror
      provenance_note: mirror of the CREMI training volumes, not the official host
  snemi3d:
    role: independent confirmatory test family (v2.1; prepared, NO compression run until explicitly requested)
    source: Zenodo record 7142003 (doi 10.5281/zenodo.7142003), file snemi.zip
    source_url: https://zenodo.org/records/7142003/files/snemi.zip?download=1
    md5: 3d25a7025f66698f33c7850ace885939
    size_bytes: 194608530
    member: seg/train-labels.tif (100 x 1024 x 1024, uint16, ZYX)
    axes: ZYX
    license: CC-BY-4.0 (attribution in docs/MUSTAQIL_DATA_SNEMI3D_UZ.md) - never redistributed
    citation: SNEMI3D (Arganda-Carreras, Seung, Vishwanathan, Berger; Kasthuri et al. 2015)
    real: true
    splits: [heldout]
    authorized_download: true
    authorized_on: "2026-11-06"
    manifest: data/manifests/confirm_snemi3d.jsonl
    preregistered_config: configs/confirm_snemi3d.yaml
  h01:
    role: independent human connectomics test family
    official_source: gs://h01-release/data/20210601/c3/
    license: see https://h01-release.storage.googleapis.com/data.html
    citation: S11
    real: true
    authorized_download: false
  microns:
    role: additional external validation (static snapshot only)
    official_source: https://www.microns-explorer.org/cortical-mm3
    citation: S16
    real: true
    authorized_download: false
  user_organelle:
    role: sparse negative control
    status: not provided by the user
    real: true
    authorized_download: false

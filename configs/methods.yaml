    family: crackle_format
    categories: [K1, K2, K5]
    panels: [A]
    role: internal
    description: Upstream pin selection + upstream serializer, pins format forced (same boundary payload)
  weighted_greedy:
    adapter: cape_native
    options: {markov_model_order: 0, format_policy: force_pins, selector: cape, reduce_equal: false,

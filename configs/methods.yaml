# Method registry (spec sections 17, 22). Run configs select methods by id.
# cape_native methods take the run config's `algorithm` section as base options; the
# method's own `options` override it (ablations, panel A forced-pins format).
schema_version: 1
methods:
  # ---------------------------------------------------------------- new method
  cape_m0:
    adapter: cape_native
    options: {markov_model_order: 0, format_policy: same_as_stock, selector: cape}
    family: crackle_format
    categories: [K1, K2, K3, K4, K5, K6]
    panels: [B]
    wrappable: true
    role: new
    description: CAPE selector (safe reductions, componentwise exact DP / local search, dual certificate); stock pins/flat rule
  cape_m5:
    adapter: cape_native
    options: {markov_model_order: 5, format_policy: same_as_stock, selector: cape}
    family: crackle_format
    categories: [K1, K2, K3, K4]
    panels: [B]
    wrappable: true
    role: new
    description: CAPE with Markov order 5 crack codes (paired with crackle_pins_opt_m5)
  cape_m0_minfmt:
    adapter: cape_native
    options: {markov_model_order: 0, format_policy: min_exact, selector: cape}
    family: crackle_format
    categories: [K1, K2, K3]
    panels: [B]
    wrappable: false
    role: new
    description: Secondary, declared before freeze - exact min(flat, CAPE pins) format choice; never the primary pair
  # -------------------------------------------- v2 (plan P1; development / seen data only)
  cape_fast_m0:
    adapter: cape_native
    options: {markov_model_order: 0, format_policy: same_as_stock, selector: cape, depth_policy: fixed_depth_width,
              certificate: "off"}
    family: crackle_format
    categories: [K1, K2, K3]
    panels: [B]
    wrappable: true
    role: new
    description: v2 CAPE-FAST - CAPE selector, depth regimes off (full-width w_D only), no certificate reported; stock pins/flat rule
  cape_fast_m5:
    adapter: cape_native
    options: {markov_model_order: 5, format_policy: same_as_stock, selector: cape, depth_policy: fixed_depth_width,
              certificate: "off"}
    family: crackle_format
    categories: [K1, K2, K3]
    panels: [B]
    wrappable: true
    role: new
    description: v2 CAPE-FAST with Markov order 5 crack codes
  cape_m0_legacy:
    adapter: cape_native
    options: {markov_model_order: 0, format_policy: same_as_stock, selector: cape, reduction_impl: legacy}
    family: crackle_format
    categories: [K2]
    panels: [B]
    wrappable: false
    role: internal
    description: v1 implementation (strided chains, sort-based dedup, dense DP) for matched timing; bitstreams identical to cape_m0
  crackle_pins_opt_corrected_m0:
    adapter: cape_native
    options: {markov_model_order: 0, format_policy: same_as_stock, selector: stock_greedy_corrected}
    family: crackle_format
    categories: [K1, K2, K3]
    panels: [B]
    wrappable: true
    role: baseline
    description: Corrected stock - upstream pins_opt selection, background and serializer; only the F2 count width fixed
  crackle_pins_opt_corrected_m5:
    adapter: cape_native
    options: {markov_model_order: 5, format_policy: same_as_stock, selector: stock_greedy_corrected}
    family: crackle_format
    categories: [K1, K2, K3]
    panels: [B]
    wrappable: true
    role: baseline
    description: Corrected stock with Markov order 5 crack codes
  safe_archive_m0_zstd3:
    adapter: safe_archive
    options: {zstd: zstd3, markov_model_order: 0, selector: cape, depth_policy: fixed_depth_width,
              certificate: "off"}
    family: crackle_format
    categories: [K1, K3]
    panels: [B]
    wrappable: false
    role: baseline
    description: SAFE-ARCHIVE engineering guard - smaller of zstd3(flat) and zstd3(CAPE-FAST); never larger than the included flat
  safe_archive_m0_zstd9:
    adapter: safe_archive
    options: {zstd: zstd9, markov_model_order: 0, selector: cape, depth_policy: fixed_depth_width,

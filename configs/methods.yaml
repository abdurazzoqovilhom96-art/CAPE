    panels: [B]
    wrappable: false
    role: internal
    experimental: true
    description: '[EXPERIMENTAL v2.1] SAFE-ARCHIVE + bounded archive-objective refinement (unpin+anchor, 8 full-file evaluations), Markov 5, zstd 3'

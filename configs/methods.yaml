    family: crackle_format
    categories: [K1, K3]
    panels: [B]
    wrappable: false
    role: baseline
    description: SAFE-ARCHIVE engineering guard with zstd level 9
  safe_archive_m5_zstd3:
    adapter: safe_archive
    options: {zstd: zstd3, markov_model_order: 5, selector: cape, depth_policy: fixed_depth_width,
              certificate: "off"}

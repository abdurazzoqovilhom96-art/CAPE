    categories: [K1, K2, K3, K4]
    panels: [B]
    wrappable: false
    role: new
    description: v2 CAPE-CERTIFIED - the CAPE-FAST stream (byte-identical) plus a restricted-model LB over ALL depth regimes
  cape_certified_m5:
    adapter: cape_native
    options: {markov_model_order: 5, format_policy: same_as_stock, selector: cape, depth_policy: fixed_depth_width,

    panels: [B]
    wrappable: false
    role: new
    description: v2 CAPE-CERTIFIED with Markov order 5 crack codes
  safe_refine_e8_m0_zstd3:
    adapter: safe_refine
    options: {zstd: zstd3, markov_model_order: 0, selector: cape, depth_policy: fixed_depth_width, max_evals: 8,
              moves: [unpin, anchor]}
    family: crackle_format
    categories: [K1, K3]
    panels: [B]
    wrappable: false
    role: internal
    experimental: true
    description: '[EXPERIMENTAL v2.1] SAFE-ARCHIVE + bounded archive-objective refinement (unpin+anchor, 8 full-file evaluations), Markov 0, zstd 3'
  safe_refine_e8_m0_zstd9:
    adapter: safe_refine
    options: {zstd: zstd9, markov_model_order: 0, selector: cape, depth_policy: fixed_depth_width, max_evals: 8,
